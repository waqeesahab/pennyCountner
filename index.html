<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SpendWise AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310b981'/%3E%3Cpath d='M8 20l5-6 4 4 7-9' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#0a1020;--s:#111a2e;--s2:#17223a;--b:#243252;--t:#eef2fb;--m:#93a0bd;--g:#10b981;--c:#22d3ee;--v:#a78bfa;--w:#fbbf24;--r:#fb7185;--sh:0 8px 28px rgba(0,0,0,.25)}
[data-theme=light]{color-scheme:light;--bg:#f2f5fa;--s:#fff;--s2:#eef2f8;--b:#d6deea;--t:#0f1a2e;--m:#53607a;--g:#047857;--c:#0e7490;--v:#6d4fd6;--w:#a16207;--r:#be123c;--sh:0 6px 18px rgba(20,40,80,.08)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav#nav{position:sticky;top:0;height:100vh;background:var(--s);border-right:1px solid var(--b);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:1.15rem;margin:0 8px 14px;display:flex;gap:8px;align-items:center}.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--g),var(--c))}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--m);text-decoration:none;font-weight:600;transition:.15s}
nav a:hover{background:var(--s2);color:var(--t)}nav a[aria-current=page]{background:var(--s2);color:var(--g);box-shadow:inset 3px 0 var(--g)}
.wrap{padding:18px clamp(14px,3vw,32px) 90px;min-width:0;max-width:1180px;width:100%;margin:0 auto}
header.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.6rem;letter-spacing:-.02em}h2{font-size:1.1rem;margin-bottom:10px}.mut{color:var(--m)}.sm{font-size:.85rem}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--b);background:var(--s2);cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--g);transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn.p{background:linear-gradient(135deg,var(--g),#0e9f6e);color:#04130d;border:0}.btn.d{color:var(--r)}.btn.s{min-height:34px;padding:0 10px;font-size:.85rem}
.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:18px;box-shadow:var(--sh);transition:.2s;min-width:0}.card:hover{transform:translateY(-2px)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.mt{margin-top:14px}
.met b{display:block;font-size:1.65rem;font-variant-numeric:tabular-nums}
label{display:block;font-weight:600;font-size:.88rem;margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--b);background:var(--s2)}input[type=checkbox]{width:auto;min-height:0}
.tabs{display:flex;gap:4px;background:var(--s2);padding:4px;border-radius:12px;overflow-x:auto}.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--m);white-space:nowrap}.tabs button[aria-pressed=true]{background:var(--s);color:var(--g)}
.bar{height:9px;border-radius:9px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--g);animation:gr .7s ease-out}@keyframes gr{from{width:0!important}}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid var(--b);font-size:.75rem}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--b)}.tx:last-child{border:0}.inc{color:var(--g)}.exp{color:var(--r)}
.err{color:var(--r);font-size:.82rem;min-height:1em}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ch{width:100%;height:auto;display:block}svg text{fill:var(--m);font-size:10px}
dialog{border:1px solid var(--b);border-radius:18px;background:var(--s);color:var(--t);padding:22px;width:min(520px,94vw);max-height:92vh;overflow:auto;animation:pop .2s}dialog::backdrop{background:rgba(0,0,0,.6)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}@keyframes in{from{opacity:0;transform:translateY(8px)}}#main{animation:in .22s}
#toasts{position:fixed;right:14px;top:14px;display:grid;gap:8px;z-index:99}.toast{background:var(--s2);border:1px solid var(--b);border-left:4px solid var(--g);padding:10px 14px;border-radius:10px;animation:in .2s}.toast.e{border-left-color:var(--r)}
#fab{display:none}
@media(max-width:860px){.app{display:block}nav#nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20;border-right:0;border-top:1px solid var(--b)}.logo{display:none}nav a{flex-direction:column;gap:0;font-size:.68rem;padding:6px 10px;white-space:nowrap}nav a[aria-current=page]{box-shadow:none}
#fab{display:flex;position:fixed;right:16px;bottom:78px;z-index:25;width:56px;height:56px;border-radius:50%;font-size:1.6rem;padding:0}.wrap{padding-bottom:140px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app"><nav id="nav" aria-label="Main"></nav><div class="wrap"><header class="top"><div><h1 id="ttl"></h1><p class="mut sm" id="dt"></p></div><div class="row"><button class="btn" data-a="switch">⇄ Switch profile</button><button class="btn" data-a="theme" aria-label="Toggle theme">◐ Theme</button><button class="btn p" data-a="add">＋ Add Transaction</button></div></header><main id="main"></main></div></div>
<button class="btn p" id="fab" data-a="add" aria-label="Add transaction">＋</button>
<div id="toasts" role="status" aria-live="polite"></div><dialog id="dlg"></dialog><dialog id="cf"></dialog>
<script>
/* ============ CONSTANTS ============ */
const BASE='spendwise_data_v1',IDX='spendwise_profiles_v1',EC=['Food & Groceries','Restaurants & Cafes','Transport & Fuel','Housing & Rent','Utilities & Bills','Shopping','Healthcare','Education','Entertainment','Travel','Personal Care','Subscriptions','Family & Gifts','Insurance','Loan Payments','Taxes & Fees','Investments & Contributions','Miscellaneous'],
IC=['Salary','Freelance Income','Business Income','Interest','Dividends','Refunds','Gifts Received','Rental Income','Other Income'],
TC=['Transfer between accounts','Transfer to savings','Transfer to investment account','Credit card repayment'],
PAY=['Cash','Bank Transfer','Debit Card','Credit Card','UPI','Wallet','Other'],ACC=['Cash','Bank','Credit Card','Wallet','Savings'],
ANN={none:0,daily:365,weekly:52,monthly:12,yearly:1},CUR={INR:'en-IN',USD:'en-US',EUR:'de-DE',GBP:'en-GB'},COL=['#10b981','#22d3ee','#a78bfa','#fbbf24','#fb7185','#60a5fa','#f472b6','#34d399'];
const PG={overview:['Overview',ov],transactions:['Transactions',txPage],analytics:['Analytics',an],budgets:['Budgets',bu],goals:['Savings Goals',goals],planner:['Smart Planner',planner],settings:['Settings',settings]};
const ICO={overview:'▦',transactions:'⇄',analytics:'◔',budgets:'▭',goals:'◎',planner:'✦',settings:'⚙'};
/* ============ HELPERS ============ */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),td=()=>ymd(new Date());
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d)},addM=(s,n)=>{const d=P(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)};
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(P(s))===s;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
/* Money is stored as integer minor units (cents/paise) to avoid float drift */
const minor=v=>{const n=Number(String(v).replace(/,/g,''));return String(v).trim()!==''&&isFinite(n)&&n>=0?Math.round(n*100):null};
const fmt=a=>isFinite(a)?new Intl.NumberFormat(CUR[S.cur],{style:'currency',currency:S.cur,maximumFractionDigits:2}).format(a/100):'—';
const fmt0=a=>isFinite(a)?new Intl.NumberFormat(CUR[S.cur],{style:'currency',currency:S.cur,maximumFractionDigits:0}).format(a):'—';
const sm=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.a,0),inR=(a,[s,e])=>a.filter(x=>x.date>=s&&x.date<=e);
const chg=(c,p)=>p>0?Math.round((c-p)/p*1000)/10:null,pc=(a,b)=>b>0?Math.round(a/b*1000)/10:null;
const wkStart=s=>addD(s,-((P(s).getDay()-S.ws+7)%7));
function rng(r,ref=td()){const d=P(ref),y=d.getFullYear(),m=d.getMonth();if(r==='day')return[ref,ref];if(r==='week'){const a=wkStart(ref);return[a,addD(a,6)]}if(r==='month')return[ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];if(r==='quarter'){const q=Math.floor(m/3)*3;return[ymd(new Date(y,q,1)),ymd(new Date(y,q+3,0))]}return[y+'-01-01',y+'-12-31']}
function prevRng(r){const a=rng(r)[0];return rng(r,r==='day'?addD(a,-1):r==='week'?addD(a,-7):r==='month'?addM(a,-1):r==='quarter'?addM(a,-3):addM(a,-12))}
function cats(A){const o={};A.filter(x=>x.type==='expense').forEach(x=>{o[x.category]=o[x.category]||[0,0];o[x.category][0]+=x.a;o[x.category][1]++});return Object.entries(o).map(([k,v])=>[k,v[0],v[1]]).sort((a,b)=>b[1]-a[1])}
function grow({s,m,r,y,beg}){const n=Math.round(y*12);if(!(n>0)||!isFinite(r)||r<=-1)return null;const i=Math.pow(1+r,1/12)-1,fv=k=>{const g=Math.pow(1+i,k);let c=i===0?m*k:m*((g-1)/i);if(beg)c*=1+i;return s*g+c};return{n,fv,total:fv(n),contrib:s+m*n}}
const recCost=(a,f)=>a*(ANN[f]||0);
/* ============ STATE ============ */
let KEY=BASE,pid=null,S,range='month',page='overview',T={q:'',type:'',cat:'',pay:'',nw:'',pl:'',sort:'new',n:20,from:'',to:''},saving=false,bm=td().slice(0,7),warn='';
const DEF=()=>({v:1,name:'',cur:'INR',theme:'dark',ws:1,income:0,fixed:0,opening:0,onboarded:false,demo:false,goal:'',style:'Balanced',txs:[],budgets:{},goals:[],dismissed:[],pl:{inc:'',ess:'',dis:'',debt:'',sv:'',st:'0',mc:'500',rt:'8',yr:'10',inf:'0',beg:'0'},efm:3});
function load(){S=DEF();try{const r=localStorage.getItem(KEY);if(!r)return;try{const d=JSON.parse(r);if(!d||!Array.isArray(d.txs))throw 0;S={...DEF(),...d}}catch(e){localStorage.setItem(KEY+'_corrupt',r);warn='Saved data was unreadable; a copy was kept under "'+KEY+'_corrupt".'}}catch(e){warn='Browser storage is unavailable; changes will not persist.'}}
function save(){if(!pid)return true;try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Could not save (storage full or blocked). Export a backup.',1);return false}}
function toast(t,e){const d=document.createElement('div');d.className='toast'+(e?' e':'');d.textContent=t;$('#toasts').append(d);setTimeout(()=>d.remove(),3800)}
function confirmDlg(t,b,l){return new Promise(res=>{const d=$('#cf');d.innerHTML=`<h2>${esc(t)}</h2><p class="mut">${esc(b)}</p><div class="row mt"><button class="btn d" value="y">${esc(l)}</button><button class="btn" value="n">Cancel</button></div>`;d.onclick=e=>{const b=e.target.closest('button');if(b){d.dataset.v=b.value;d.close()}};d.onclose=()=>res(d.dataset.v==='y');d.dataset.v='n';d.showModal()})}
/* ============ DEMO DATA ============ */
function demo(){let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647,out=[],t=td(),mk=(d,type,title,amt,category,nw,pl,pay='UPI',rec='none')=>out.push({id:uid(),type,title,a:Math.round(amt*100),category,date:d,pay,account:'Bank',nw,planned:pl,rec,note:'',demo:1});
for(let m=0;m<4;m++){const b=addM(t.slice(0,8)+'01',-m),d=k=>b.slice(0,8)+String(k).padStart(2,'0');if(d(1)<=t){mk(d(1),'income','Monthly salary',60000,'Salary','na',true,'Bank Transfer');mk(d(2),'expense','House rent',16000,'Housing & Rent','need',true,'Bank Transfer','monthly');mk(d(5),'expense','Streaming & apps',699,'Subscriptions','want',true,'Credit Card','monthly')}
for(let k=3;k<=28;k++)if(d(k)<=t&&rnd()<.6){const x=rnd();if(x<.35)mk(d(k),'expense','Groceries',300+rnd()*900,'Food & Groceries','need',true);else if(x<.55)mk(d(k),'expense','Cafe / takeaway',150+rnd()*450,'Restaurants & Cafes','want',rnd()<.4);else if(x<.75)mk(d(k),'expense','Cab / fuel',80+rnd()*400,'Transport & Fuel','need',true);else if(x<.9)mk(d(k),'expense','Online shopping',500+rnd()*2500,'Shopping','want',false,'Debit Card');else mk(d(k),'expense','Electricity bill',900+rnd()*600,'Utilities & Bills','need',true)}}
S.txs.push(...out);S.demo=true;S.budgets.__all=4500000;S.budgets['Food & Groceries']=800000;S.budgets['Restaurants & Cafes']=300000;S.budgets.Shopping=400000;S.goals.push({id:uid(),name:'Emergency fund (demo)',target:15000000,saved:4000000,date:addM(t,10),monthly:0,pri:'High'})}
/* ============ CHARTS (custom SVG) ============ */
function donut(rows){const tot=rows.reduce((s,r)=>s+r[1],0);if(!tot)return'<p class="mut">No expenses in this period.</p>';let off=0;const R=42,C=2*Math.PI*R;
return`<div class="row"><svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="Expense categories">${rows.slice(0,8).map((r,i)=>{const l=r[1]/tot*C,s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${COL[i]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(r[0])}: ${fmt(r[1])}</title></circle>`;off+=l;return s}).join('')}</svg><div class="sm" style="flex:1;min-width:150px">${rows.slice(0,8).map((r,i)=>`<div class="row sp"><span><span style="color:${COL[i]}">●</span> ${esc(r[0])}</span><b>${pc(r[1],tot)}%</b></div>`).join('')}</div></div><p class="sr">${rows.map(r=>esc(r[0])+' '+fmt(r[1])+' ('+r[2]+' transactions)').join('; ')}</p>`}
function gbars(d){if(!d.length||d.every(x=>!x[1]&&!x[2]))return'<p class="mut">No data in this period.</p>';const mx=Math.max(...d.flatMap(x=>[x[1],x[2]]),1),W=600,H=200,bw=Math.min(24,W/d.length/2.6),st=W/d.length;
return`<svg class="ch" viewBox="0 0 ${W} ${H+24}" role="img" aria-label="Income versus expenses">${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*H}" y2="${H-f*H}" stroke="var(--b)"/>`).join('')}${d.map((x,i)=>{const cx=st*i+st/2,h1=x[1]/mx*H,h2=x[2]/mx*H;return`<rect x="${cx-bw-1}" y="${H-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--g)"><title>${esc(x[0])} income ${fmt(x[1])}</title></rect><rect x="${cx+1}" y="${H-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--r)"><title>${esc(x[0])} expenses ${fmt(x[2])}</title></rect>${d.length<=14||i%Math.ceil(d.length/10)===0?`<text x="${cx}" y="${H+14}" text-anchor="middle">${esc(x[0])}</text>`:''}`}).join('')}</svg><p class="sm mut"><span class="inc">■</span> Income <span class="exp">■</span> Expenses · max ${fmt(mx)}</p><p class="sr">${d.map(x=>x[0]+': income '+fmt(x[1])+', expenses '+fmt(x[2])).join('; ')}</p>`}
function line(pts,col='var(--c)'){if(pts.length<2)return'<p class="mut">Not enough points to chart.</p>';const mx=Math.max(...pts.map(p=>p[1]),1),W=600,H=180,st=W/(pts.length-1),xy=pts.map((p,i)=>[i*st,H-p[1]/mx*H]),pl=xy.map(p=>p.join(',')).join(' ');
return`<svg class="ch" viewBox="0 0 ${W} ${H+24}" role="img" aria-label="Trend chart"><polygon points="0,${H} ${pl} ${W},${H}" fill="${col}" opacity=".12"/><polyline points="${pl}" fill="none" stroke="${col}" stroke-width="2.5"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${pts.length>40?0:3.5}" fill="${col}"><title>${esc(pts[i][0])}: ${fmt0(pts[i][1])}</title></circle>`).join('')}<text x="0" y="${H+16}">${esc(pts[0][0])}</text><text x="${W}" y="${H+16}" text-anchor="end">${esc(pts[pts.length-1][0])}</text></svg><p class="sr">${pts.map(p=>p[0]+' '+p[1]).join(', ')}</p>`}
function hbars(rows){return rows.map(r=>`<div class="mt"><div class="row sp sm"><span>${esc(r[0])}</span><span>${r[1]}</span></div><div class="bar"><i style="width:${Math.min(100,r[2])}%;background:${r[3]||'var(--g)'}"></i></div></div>`).join('')}
/* ============ INSIGHTS (transparent local rules) ============ */
function insights(){const A=inR(S.txs,rng('month')),ex=A.filter(x=>x.type==='expense'),tE=sm(A,'expense'),tI=sm(A,'income'),o=[];
if(!ex.length)return[];
if(tI>0&&tE>tI)o.push({id:'cf',t:'Spending exceeds income this month',why:`Expenses ${fmt(tE)} vs income ${fmt(tI)}.`,act:`Gap is ${fmt(tE-tI)}. Review the largest categories below.`,mo:tE-tI});
const f=cats(A).find(c=>c[0]==='Food & Groceries'),fb=S.budgets['Food & Groceries'];if(f&&fb&&f[1]>fb)o.push({id:'food',t:'Food spending is over budget',why:`${fmt(f[1])} spent vs ${fmt(fb)} budget.`,act:`Bringing it back to budget would free ${fmt(f[1]-fb)} per month.`,mo:f[1]-fb});
const up=ex.filter(x=>!x.planned).reduce((s,x)=>s+x.a,0),up2=pc(up,tE);if(up2>=25)o.push({id:'unp',t:'A quarter or more of spending was unplanned',why:`Unplanned: ${fmt(up)} (${up2}% of expenses).`,act:'Consider a small monthly discretionary budget.',mo:Math.round(up*.2)});
const sb=S.txs.filter(x=>x.type==='expense'&&x.rec!=='none'&&x.category==='Subscriptions'),sa=sb.reduce((s,x)=>s+recCost(x.a,x.rec),0);if(sb.length)o.push({id:'sub',t:'Review your recurring subscriptions',why:`${sb.length} recurring subscription entr${sb.length>1?'ies':'y'}; estimated ${fmt(sa)} per year.`,act:'Cancel any you no longer use.',mo:Math.round(sa/12)});
const avg=tE/ex.length,sx=ex.filter(x=>x.a<avg*.3);if(sx.length>=5)o.push({id:'sm',t:'Many small purchases',why:`${sx.length} purchases under ${fmt(avg*.3)} total ${fmt(sx.reduce((s,x)=>s+x.a,0))}.`,act:'Not necessarily wasteful; just worth a look.',mo:0});
return o.filter(x=>!S.dismissed.includes(x.id))}
/* ============ PAGES ============ */
const rangeTabs=()=>`<div class="tabs" role="group" aria-label="Date range">${['day','week','month','quarter','year'].map(r=>`<button data-a="range" data-r="${r}" aria-pressed="${range===r}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div>`;

function onboard(){const d=$('#dlg');d.innerHTML=`<h2>Welcome to SpendWise AI</h2><p class="mut sm">Understand your spending. Build your future. All optional questions can be skipped.</p><form id="of"><label for="o1">Preferred name (optional)</label><input id="o1" maxlength="40" value="${esc(S.name)}"><label for="o2">Currency</label><select id="o2">${opt(Object.keys(CUR),'INR')}</select><label for="o3">Monthly income (optional)</label><input id="o3" inputmode="decimal"><label for="o4">Approx. monthly fixed expenses (optional)</label><input id="o4" inputmode="decimal"><label for="o5">Main goal</label><select id="o5">${opt(['Save more','Control daily spending','Build an emergency fund','Save for a purchase','Learn about investing','Track all my money'],'Track all my money')}</select><label for="o6">Budgeting style</label><select id="o6">${opt(['Conservative','Balanced','Flexible'],'Balanced')}</select><label for="o7">Start with</label><select id="o7"><option value="e">Empty account</option><option value="s">Sample transactions</option></select><div class="err" id="oe"></div><div class="row mt"><button class="btn p">Get started</button></div></form>`;d.oncancel=e=>e.preventDefault();d.showModal()}
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const csvC=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
const csvEx=()=>dl('spendwise-transactions-'+td()+'.csv',['Date,Type,Title,Amount,Category,Payment,Account,NeedWant,Planned,Recurring,Note',...S.txs.map(t=>[t.date,t.type,t.title,(t.a/100).toFixed(2),t.category,t.pay,t.account,t.nw,t.planned,t.rec,t.note].map(csvC).join(','))].join('\n'),'text/csv');
const okTx=t=>t&&typeof t==='object'&&typeof t.id==='string'&&['income','expense','transfer'].includes(t.type)&&Number.isInteger(t.a)&&t.a>0&&typeof t.title==='string'&&typeof t.category==='string'&&validDate(String(t.date));
async function importF(f){let d;try{d=JSON.parse(await f.text())}catch(e){return toast('Import failed: not valid JSON. Nothing changed.',1)}
if(!d||d.v!==1||!Array.isArray(d.txs)||!d.txs.every(okTx))return toast('Import failed: unsupported or invalid backup. Nothing changed.',1);
if(await confirmDlg('Replace current data?',`The backup has ${d.txs.length} transactions and will replace everything currently stored.`,'Replace')){const old=S;S={...DEF(),...d,txs:d.txs.map(t=>({...t,title:t.title.slice(0,80)}))};if(save()){toast('Import completed.');render()}else S=old}}
/* ============ RENDER + EVENTS ============ */
function countUps(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;document.querySelectorAll('[data-n]').forEach(e=>{const n=Number(e.dataset.n);if(rm||!isFinite(n))return;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/500);e.textContent=fmt(n*k);if(k<1)requestAnimationFrame(f);else e.textContent=fmt(n)})(t0)})}
function render(){if(!pid)return;document.documentElement.dataset.theme=S.theme;const h=location.hash.slice(1);page=PG[h]?h:'overview';$('#ttl').textContent=PG[page][0];$('#dt').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' · Profile: '+((pidx()[pid]||{}).label||'');
$('#nav').innerHTML=`<div class="logo"><i></i>SpendWise AI</div>`+Object.keys(PG).map(k=>`<a href="#${k}" ${k===page?'aria-current="page"':''}><span aria-hidden="true">${ICO[k]}</span>${PG[k][0].replace('Savings ','')}</a>`).join('');
$('#main').innerHTML=PG[page][1]();if(page==='planner')planCalc();countUps()}
const L=()=>{$('#list').innerHTML=listH()};
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fq'){T.q=t.value;T.n=20;L()}if(t.dataset.pl){S.pl[t.dataset.pl]=t.value;save();planCalc()}if(t.closest('#tf')){if(t.id==='f_type')catSel();fSum()}});
document.addEventListener('change',e=>{const t=e.target,m={ft:'type',fc:'cat',fp:'pay',fn:'nw',fl:'pl',ff:'from',fe:'to',fs:'sort'};if(m[t.id]){T[m[t.id]]=t.value;T.n=20;L()}
if(t.id==='bmn'&&t.value){bm=t.value;render()}if(t.dataset.bk){const v=t.value.trim()===''?null:minor(t.value);if(t.value.trim()!==''&&v==null)return toast('Enter a valid amount.',1);if(v==null||v===0)delete S.budgets[t.dataset.bk];else S.budgets[t.dataset.bk]=v;if(save()){toast('Budget updated.');render()}}
if(t.id==='imp'&&t.files[0]){importF(t.files[0]);t.value=''}if(t.id==='f_type'||t.id==='f_cat'||t.id==='f_rec'||t.id==='f_date')fSum()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
if(f.id==='tf')submitTx(f,e.submitter&&e.submitter.value==='again');
if(f.id==='lf'){const v=$('#lg').value.trim();if(!v)return $('#le').textContent='Enter your email or name.';$('#dlg').oncancel=null;$('#dlg').close();openProfile(v);return}
if(f.id==='of'){const i=minor(f.o3.value||'0'),x=minor(f.o4.value||'0');if(i==null||x==null)return $('#oe').textContent='Please enter valid non-negative numbers.';Object.assign(S,{name:f.o1.value.trim(),cur:f.o2.value,income:i,fixed:x,goal:f.o5.value,style:f.o6.value,onboarded:true});if(f.o7.value==='s')demo();save();$('#dlg').oncancel=null;$('#dlg').close();render()}
if(f.id==='gf'){const t=minor($('#gt').value),s=minor($('#gs').value||'0');if(!$('#gn').value.trim()||!t||s==null)return $('#ge').textContent='Enter a name, a target above zero, and a valid saved amount.';S.goals.push({id:uid(),name:$('#gn').value.trim(),target:t,saved:s,date:$('#gd').value,pri:$('#gp').value});if(save()){toast('Goal added.');render()}}
if(f.id==='sf'){const o=minor($('#so').value||'0'),i=minor($('#si').value||'0'),m=Number($('#se').value);if(o==null||i==null||!(m>=1&&m<=24))return $('#sr').textContent='Check the numbers: amounts must be valid, emergency months 1–24.';Object.assign(S,{name:$('#sn').value.trim(),cur:$('#sc').value,ws:Number($('#sw').value),opening:o,income:i,efm:m});if(save()){toast('Settings saved.');render()}}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,t=S.txs.find(x=>x.id===id);
if(a==='switch'){showLogin()}else if(a==='prof'){const p=pidx()[b.dataset.k];if(p){$('#dlg').oncancel=null;$('#dlg').close();openProfile(p.label)}}else if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';save();render()}else if(a==='add')openTx();else if(a==='close')$('#dlg').close();else if(a==='edit')openTx(t);
else if(a==='dup'){S.txs.push({...t,id:uid(),date:td(),createdAt:new Date().toISOString()});if(save()){toast('Transaction duplicated (dated today).');render()}}
else if(a==='del'){if(await confirmDlg('Delete transaction?','This removes it from every total and chart.','Delete')){const old=S.txs;S.txs=S.txs.filter(x=>x.id!==id);if(save()){toast('Transaction deleted.');render()}else S.txs=old}}
else if(a==='range'){range=b.dataset.r;render()}else if(a==='more'){T.n+=20;L()}else if(a==='clr'){T={...T,q:'',type:'',cat:'',pay:'',nw:'',pl:'',from:'',to:'',n:20};render()}
else if(a==='csv')csvEx();else if(a==='json')dl('spendwise-backup-'+td()+'.json',JSON.stringify(S,null,2),'application/json');else if(a==='pick')$('#imp').click();
else if(a==='demo'){if(S.demo||S.txs.length)if(!await confirmDlg('Add sample data?','Sample transactions (marked demo) will be added to your existing data.','Add'))return;demo();if(save()){toast('Sample data loaded.');render()}}
else if(a==='reset'){if(await confirmDlg('Delete all data?','This clears all SpendWise data from this browser and cannot be undone unless you exported a backup.','Delete everything')){try{localStorage.removeItem(KEY)}catch(e){}const th=S.theme;S=DEF();S.theme=th;S.onboarded=false;save();render();onboard()}}
else if(a==='delb'){delete S.budgets[b.dataset.k];save();render()}else if(a==='delg'){S.goals=S.goals.filter(g=>g.id!==id);save();render()}
else if(a==='contrib'){const g=S.goals.find(x=>x.id===id),v=minor($('#c_'+id).value);if(!v)return toast('Enter a contribution above zero.',1);g.saved+=v;if(save()){toast('Contribution added.');render()}}});
window.addEventListener('hashchange',render);
/* ============ PROFILES: data is saved per email/name in this browser ============ */
const pidx=()=>{try{return JSON.parse(localStorage.getItem(IDX))||{}}catch(e){return{}}};
function openProfile(raw){const label=raw.trim().slice(0,80),id=label.toLowerCase().replace(/\s+/g,' '),ix=pidx(),isNew=!ix[id];
if(isNew){if(!Object.keys(ix).length){try{const lg=localStorage.getItem(BASE);if(lg)localStorage.setItem(BASE+':'+id,lg)}catch(e){}}ix[id]={label,created:new Date().toISOString()};try{localStorage.setItem(IDX,JSON.stringify(ix))}catch(e){toast('Could not save the profile list.',1)}}
pid=id;KEY=BASE+':'+id;try{sessionStorage.setItem('spendwise_active',id)}catch(e){}
load();if(isNew&&!S.name&&!label.includes('@'))S.name=label;save();render();if(!S.onboarded)onboard()}
function showLogin(){pid=null;KEY=BASE;try{sessionStorage.removeItem('spendwise_active')}catch(e){}$('#main').innerHTML='';$('#nav').innerHTML='';const ix=pidx(),ks=Object.keys(ix),d=$('#dlg');
d.innerHTML=`<h2>Welcome to SpendWise AI</h2><p class="mut sm">Enter your email or name. Returning? Your saved dashboard comes back. New? You start with a fresh one.</p><form id="lf"><label for="lg">Email or name</label><input id="lg" maxlength="80" autocomplete="off"><div class="err" id="le"></div><button class="btn p mt" style="width:100%">Continue</button></form>${ks.length?`<p class="sm mut mt">Profiles on this device:</p><div class="row">${ks.map(k=>`<button class="btn s" data-a="prof" data-k="${esc(k)}">${esc(ix[k].label)}</button>`).join('')}</div>`:''}<p class="sm mut mt">This is not a password-protected account. Data is stored only in this browser, anyone using this browser can open any profile, and it does not sync between devices.</p>`;
d.oncancel=e=>e.preventDefault();if(!d.open)d.showModal();setTimeout(()=>$('#lg')&&$('#lg').focus(),50)}
let act=null;try{act=sessionStorage.getItem('spendwise_active')}catch(e){}
if(act&&pidx()[act])openProfile(pidx()[act].label);else showLogin();
</script></body></html>
